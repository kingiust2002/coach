version: 0.3.0+4

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0 <3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  persian_datetime_picker: 3.1.0
  shamsi_date: ^1.0.4
  sqflite: ^2.3.3+1
