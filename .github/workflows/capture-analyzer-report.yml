name: Capture analyzer diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'feature/exercise-media-calendar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze > analyze-report.txt 2>&1
          code=$?
          echo >> analyze-report.txt
          echo "ANALYZE_EXIT_CODE=$code" >> analyze-report.txt
          exit 0

      - name: Commit report and remove workflow
        shell: bash
        run: |
          rm .github/workflows/capture-analyzer-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: capture analyzer report"
          git push origin HEAD:${GITHUB_HEAD_REF}
