name: Format Supabase integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/core/cloud/**'
      - 'lib/features/account/**'
      - 'test/core/cloud/**'
      - '.github/workflows/format-supabase-pr.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.6'
          channel: stable
          cache: true
      - run: dart format lib/core/cloud lib/features/account test/core/cloud
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/cloud lib/features/account test/core/cloud
          git commit -m "style: format Supabase integration"
          git push
