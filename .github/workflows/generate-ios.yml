name: Generate iOS Platform

on:
  push:
    branches:
      - agent/add-ios-signing

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/add-ios-signing

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform
        run: flutter create . --platforms=ios --org com.kingiust --project-name coach_app

      - name: Commit iOS platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No iOS changes to commit."
            exit 0
          fi
          git commit -m "chore: add generated iOS platform"
          git push origin HEAD:agent/add-ios-signing
