name: Finalize iOS Signing Configuration

on:
  push:
    branches:
      - agent/add-ios-signing

concurrency:
  group: finalize-ios-signing
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/add-ios-signing

      - name: Normalize iOS bundle identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          text = text.replace('com.kingiust.coachApp.RunnerTests', 'com.kingiust.coach.RunnerTests')
          text = text.replace('com.kingiust.coachApp', 'com.kingiust.coach')
          project.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/generate-ios.yml
          git add ios/Runner.xcodeproj/project.pbxproj .github/workflows/generate-ios.yml
          git commit -m "chore: finalize iOS bundle id and signing setup"
          git push origin HEAD:agent/add-ios-signing
