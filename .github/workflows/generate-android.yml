name: Generate Android Platform

on:
  push:
    branches:
      - agent/add-android-platform

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/add-android-platform

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.kingiust --project-name coach_app

      - name: Commit Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "No Android changes to commit."
            exit 0
          fi
          git commit -m "chore: add generated Android platform"
          git push origin HEAD:agent/add-android-platform
