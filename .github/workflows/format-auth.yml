name: Format auth changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: >-
          dart format
          lib/features/account/data/cloud_account_service.dart
          lib/features/account/presentation/cloud_account_controller.dart
          lib/features/account/presentation/cloud_account_page.dart
          test/cloud_account_controller_test.dart

      - name: Commit formatting
        shell: bash
        run: |
          git add lib/features/account test/cloud_account_controller_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format cloud auth changes"
          git push origin HEAD:${{ github.head_ref }}
