name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FLUTTER_VERSION: 3.32.6

jobs:
  cleanup-phase2:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter baseline
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply and validate cleanup
        run: |
          python3 tool/phase2_cleanup.py
          dart format lib test
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm tool/phase2_cleanup.py
          git add lib test tool/phase2_cleanup.py
          git commit -m "refactor: remove deprecated Flutter APIs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter baseline
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Report analyzer failure
        if: steps.analyze.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('analyze.log', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- flutter-analyze-report -->\n### Flutter Analyze failed\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Enforce analyzer result
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Test
        run: flutter test

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee android-build.log

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-flutter-${{ env.FLUTTER_VERSION }}
          path: android-build.log
          if-no-files-found: warn

      - name: Report Android build failure
        if: steps.android_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('android-build.log', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- flutter-android-build-report -->\n### Flutter Android build failed\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Enforce Android build result
        if: steps.android_build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coach-debug-apk-flutter-${{ env.FLUTTER_VERSION }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-verify:
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter baseline
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        id: ios_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign 2>&1 | tee ios-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-flutter-${{ env.FLUTTER_VERSION }}
          path: ios-build.log
          if-no-files-found: warn

      - name: Report iOS build failure
        if: steps.ios_build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ios-build.log', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- flutter-ios-build-report -->\n### Flutter iOS build failed\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Enforce iOS build result
        if: steps.ios_build.outcome == 'failure'
        run: exit 1
