name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform for signing branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/add-ios-signing'
        run: flutter create . --platforms=ios --org com.kingiust --project-name coach_app

      - name: Commit generated iOS platform
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/add-ios-signing'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No iOS changes to commit."
          else
            git commit -m "chore: add generated iOS platform"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Report analyzer failure
        if: steps.analyze.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('analyze.log', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- flutter-analyze-report -->\n### Flutter Analyze failed\n\n\`\`\`text\n${output}\n\`\`\``
            });

      - name: Enforce analyzer result
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coach-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
