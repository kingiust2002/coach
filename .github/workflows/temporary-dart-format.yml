name: Temporary Dart Format

on:
  push:
    branches:
      - fix/startup-white-screen

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/startup-white-screen
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply dart format"
          git push origin HEAD:fix/startup-white-screen
