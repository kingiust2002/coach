name: Modernize Phase 1 UI

on:
  push:
    branches:
      - coach-flutlab-v4-0727

permissions:
  contents: write

concurrency:
  group: modernize-phase-1-ui
  cancel-in-progress: true

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: coach-flutlab-v4-0727

      - name: Set up Flutter 3.32.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.6
          channel: stable
          cache: true

      - name: Replace deprecated APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          opacity_count = 0
          for path in Path('lib').rglob('*.dart'):
              text = path.read_text(encoding='utf-8')
              opacity_count += text.count('.withOpacity(')
              text = text.replace('.withOpacity(', '.withValues(alpha: ')
              path.write_text(text, encoding='utf-8')

          form = Path('lib/features/athletes/presentation/athlete_form_page.dart')
          text = form.read_text(encoding='utf-8')
          old = '''    return WillPopScope(
      onWillPop: _confirmDiscard,
      child: Scaffold('''
          new = '''    return PopScope<Object?>(
      canPop: !_dirty,
      onPopInvokedWithResult: (bool didPop, Object? result) async {
        if (didPop || _saving || !_dirty) {
          return;
        }
        final bool discard = await _confirmDiscard();
        if (discard && mounted) {
          setState(() => _dirty = false);
          Navigator.of(context).pop();
        }
      },
      child: Scaffold('''
          if old not in text:
              raise SystemExit('WillPopScope source pattern not found.')
          form.write_text(text.replace(old, new, 1), encoding='utf-8')

          if opacity_count == 0:
              raise SystemExit('No deprecated opacity calls were found.')
          print(f'Replaced {opacity_count} deprecated opacity calls.')
          PY

      - name: Format and analyze
        run: |
          dart format lib test
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/modernize-phase1-ui.yml
          git add lib test pubspec.lock .github/workflows/modernize-phase1-ui.yml
          git commit -m "refactor: remove deprecated phase 1 Flutter APIs"
          git push origin HEAD:coach-flutlab-v4-0727
