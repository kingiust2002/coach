name: Generate FlutLab development keystore

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/add-flutlab-dev-key'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate project signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/coach-flutlab-dev.jks ]; then
            echo "Keystore already exists."
            exit 0
          fi
          keytool -genkeypair \
            -keystore android/coach-flutlab-dev.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias coach-flutlab-dev \
            -storepass coach-flutlab-development-2026 \
            -keypass coach-flutlab-development-2026 \
            -dname "CN=Coach FlutLab Development, OU=Development, O=Kingiust, C=IR"
          keytool -list -v \
            -keystore android/coach-flutlab-dev.jks \
            -alias coach-flutlab-dev \
            -storepass coach-flutlab-development-2026

      - name: Commit keystore to request branch
        shell: bash
        run: |
          set -euo pipefail
          git add -f android/coach-flutlab-dev.jks
          if git diff --cached --quiet; then
            echo "No keystore change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add stable FlutLab development keystore"
          git push origin HEAD:${GITHUB_HEAD_REF}
